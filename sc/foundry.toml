[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Toolchain fijado (RF-005 / B-5): compilador, optimizador y EVM deterministas.
# evm_version = "paris" evita PUSH0/MCOPY y maximiza compatibilidad de red (BESU/sidechains).
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
# RF-002: el artefacto compilado incluye el storage layout para que el test
# `test_RF002_storage_layout_sin_bypassCompliance` pueda verificar que el flag retirado no reaparece.
extra_output = ["storageLayout"]
# RF-010 (Ciclo 9): el script canonico de despliegue persiste el artefacto verificable en
# `deployments/`. Foundry exige permiso explicito para escribir fuera de `out/`; se conserva
# la lectura del proyecto (que el default aportaba) y se anade escritura SOLO en `deployments/`.
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read-write", path = "./deployments" },
]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/"
]

# Reproducibilidad del fuzz: con semilla fija las entradas (y por tanto el gas) son deterministas,
# lo que permite que el baseline de gas (`forge snapshot --check --tolerance 5`, RNF-001/D-039)
# cubra tambien los tests fuzz sin diffs espurios. Requisito de B-5 (build reproducible).
[fuzz]
runs = 256
seed = "0x525741"

# RF-009 (Fase 4) — invariantes con estado (`test/invariant/`).
# Presupuesto acotado para que el job `test` del pipeline siga por debajo de ~3-4 min: cada
# contrato de invariantes ejecuta `runs * depth` llamadas al handler y `runs` evaluaciones de
# cada invariante. `fail_on_revert = false` es deliberado: los handlers no revierten (encapsulan
# las llamadas en bajo nivel) y las violaciones se registran en ghosts, de modo que un revert
# inesperado de una accion acotada no aborta la secuencia entera.
[invariant]
runs = 64
depth = 64
fail_on_revert = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
