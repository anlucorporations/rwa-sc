# =============================================================================
# RF-009 (Ciclo 11) — Pipeline de CI de RWA (rama `rwa-sc-DSH-GCP`).
#
# Materializa los gates ya decididos en los Ciclos 1..10:
#   validate  -> submódulos pinneados (B-5 / RF-005)
#   build     -> `forge build`
#   fmt       -> `forge fmt --check`
#   test      -> `forge test` (gate RNF-003) + conteo REAL como artefacto
#   coverage  -> `forge coverage --report summary --report lcov` + gate RNF-002
#                (agregado de `src/` >= 80 %, D-017) y D-042 (mínimo por
#                contrato >= 80 %), con `sc/script/ci/check_coverage.sh`
#   gas       -> `forge snapshot --check --tolerance 5` (gate RNF-001 / D-039)
#   ci-checks -> check_no_bypass_flag.sh (RF-002) + check_docs.sh + abi_diff.sh
#                (RF-006)
#
# La rama de CI es `rwa-sc-DSH-GCP`. El pipeline AÚN NO ha corrido en remoto:
# no se ha hecho `push` (regla del proyecto: sin orden explícita del usuario no
# hay push). Ver `README.md` y `RepoTecnico/entornos_globales.md`.
#
# Sin secretos: el pipeline no despliega; las claves de despliegue viven en
# variables protegidas / GCP Secret Manager (RF-010).
# =============================================================================

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "rwa-sc-DSH-GCP"'
    - when: never

stages:
  - validate
  - build
  - fmt
  - test
  - coverage
  - gas
  - ci-checks

variables:
  # Toolchain fijado y coherente con `sc/foundry.toml` (solc 0.8.20, evm paris).
  FOUNDRY_PROFILE: "default"
  SOLC_VERSION: "0.8.20"
  # Umbral de cobertura centralizado en UNA variable (CU-11 / EARS
  # `ci_check_RF009_umbral_configurable_centralizado`); `check_coverage.sh` la lee.
  COVERAGE_THRESHOLD: "80"
  # D-042: mínimo por contrato (líneas) para que el promedio no oculte un contrato.
  COVERAGE_CONTRACT_THRESHOLD: "80"
  # B-5: GitLab inicializa los submódulos recursivamente ANTES del job.
  GIT_SUBMODULE_STRATEGY: "recursive"
  # No se cachea `~/.svm` (fuera del proyecto); el solc 0.8.20 se descarga por job.

default:
  # Imagen oficial de Foundry con versión FIJADA (verificada en ghcr el 2026-10-10:
  # `v1.8.3` responde 200). Para actualizarla, cambiar el tag aquí y en
  # `FOUNDRY_VERSION_LOCAL` de `RepoTecnico/entornos_globales.md`.
  image:
    name: ghcr.io/foundry-rs/foundry:v1.8.3
    entrypoint: [""]
  interruptible: true
  # La imagen corre como usuario no-root (`foundry`, uid 1000) sobre un checkout
  # propiedad de otro UID: sin esto, git aborta con "detected dubious ownership"
  # (fallo real observado en los pipelines 2934157857 y 2934190160). Se usa el
  # comodín porque el problema también aparece en los submódulos anidados
  # (`sc/lib/forge-std`, `sc/lib/openzeppelin-contracts`, ...).
  before_script:
    - git config --global --add safe.directory '*'
  cache:
    key:
      files:
        - sc/foundry.toml
        - sc/foundry.lock
    paths:
      - sc/cache/
      - sc/out/

# Regla común: merge requests y la rama de contratos.
.ci_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "rwa-sc-DSH-GCP"'

# --- 1. validate: submódulos pinneados (B-5) --------------------------------
validate:
  stage: validate
  extends: .ci_rules
  script:
    - |
      set -euo pipefail
      git submodule update --init --recursive
      echo "-- git submodule status --"
      git submodule status
      bad="$(git submodule status | grep -E '^[-+]' || true)"
      if [ -n "${bad}" ]; then
        echo "FAIL: submódulos sin inicializar (-) o desalineados (+):" >&2
        printf '%s\n' "${bad}" >&2
        exit 1
      fi
      declared="$(grep -cE '^[[:space:]]*path = sc/lib/' .gitmodules)"
      if [ "${declared}" -ne 3 ]; then
        echo "FAIL: .gitmodules declara ${declared} submódulos en sc/lib/ (se esperan 3)" >&2
        exit 1
      fi
      echo "OK: 3 submódulos pinneados, sin prefijos -/+"

# --- 2. build ----------------------------------------------------------------
build:
  stage: build
  extends: .ci_rules
  script:
    - cd sc
    - forge build

# --- 3. fmt ------------------------------------------------------------------
fmt:
  stage: fmt
  extends: .ci_rules
  script:
    - cd sc
    - forge fmt --check

# --- 4. test: gate RNF-003 + conteo real como artefacto ----------------------
test:
  stage: test
  extends: .ci_rules
  script:
    - |
      set -eo pipefail
      cd sc
      mkdir -p ci-artifacts
      forge test 2>&1 | tee ci-artifacts/test-run.log
      {
        echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "commit=${CI_COMMIT_SHA}"
        echo "branch=${CI_COMMIT_REF_NAME}"
        echo "tests_listed=$(forge test --list | grep -cE '^    test')"
        echo "invariant_functions_listed=$(forge test --list | grep -cE '^    invariant_')"
        grep -E 'tests passed' ci-artifacts/test-run.log | tail -n 1
      } | tee ci-artifacts/test-count.txt
  artifacts:
    name: "test-count-${CI_COMMIT_SHORT_SHA}"
    paths:
      - sc/ci-artifacts/test-count.txt
      - sc/ci-artifacts/test-run.log
    expire_in: 1 week

# --- 5. coverage: gate RNF-002 (D-017) + D-042, publica lcov ----------------
# La cobertura de `src/` la fijan las suites unitarias (97,12 % estable). Los invariantes solo
# anaden coste de instrumentacion, asi que se ejecutan con el presupuesto minimo de 1 run x
# 1 call (FOUNDRY_INVARIANT_RUNS/DEPTH): 204 s -> 65 s medidos en local, mismo 97,12 % de `src/`.
coverage:
  stage: coverage
  extends: .ci_rules
  variables:
    FOUNDRY_INVARIANT_RUNS: "1"
    FOUNDRY_INVARIANT_DEPTH: "1"
  script:
    - |
      set -eo pipefail
      cd sc
      mkdir -p ci-artifacts
      forge coverage --report summary --report lcov 2>&1 | tee ci-artifacts/coverage-summary.txt
      bash script/ci/check_coverage.sh ci-artifacts/coverage-summary.txt
  artifacts:
    name: "coverage-${CI_COMMIT_SHORT_SHA}"
    paths:
      - sc/lcov.info
      - sc/ci-artifacts/coverage-summary.txt
    expire_in: 1 week

# --- 6. gas: gate RNF-001 / D-039 -------------------------------------------
gas:
  stage: gas
  extends: .ci_rules
  script:
    - cd sc
    - forge snapshot --check --tolerance 5

# --- 7. ci-checks: gates de RF-002 y RF-006 ---------------------------------
# Los gates son autosuficientes: `abi_diff.sh` ya NO requiere `jq` (usa la salida
# cruda y determinista de `forge inspect` + `diff`/`comm`/`grep`), porque la imagen
# oficial de Foundry es `ubuntu:22.04` + `git` y NO trae `jq` ni `python3`.
ci-checks:
  stage: ci-checks
  extends: .ci_rules
  script:
    - cd sc
    - bash script/ci/check_no_bypass_flag.sh
    - bash script/ci/check_docs.sh
    - bash script/ci/abi_diff.sh
